<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civilization II — original runtime</title>
<style>
html,body { margin:0; background:#16191e; color:#eee; font:14px system-ui,sans-serif; }
main { width:640px; margin:0 auto; }
canvas { display:block; width:640px; height:480px; image-rendering:pixelated; outline:none; }
nav { display:flex; align-items:center; gap:8px; padding:8px 0; }
button { padding:6px 12px; }
#status { margin-left:auto; }
html.embed,html.embed body { width:100%; height:100%; overflow:hidden; }
html.embed main { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
html.embed nav { display:none; }
html.embed canvas { width:min(100vw, calc(100vh * 4 / 3)) !important; height:min(100vh, calc(100vw * 3 / 4)) !important; flex:none; }
</style>
<script>if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');</script>
<main>
  <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Original Civilization II game"></canvas>
  <nav><button id="start">Start game</button><button id="pause">Pause</button><button id="resume">Resume</button><span id="status">Ready to start</span></nav>
</main>
<script src="runtime-loader.js"></script>
<script>
const message = document.querySelector('#status');
function showError(error) { message.textContent = error.message; }
document.querySelector('#start').onclick = () => Civ2RuntimeReady.then(runtime => runtime.boot()).then(() => message.textContent = 'Running').catch(showError);
document.querySelector('#pause').onclick = () => Civ2RuntimeReady.then(runtime => runtime.pause()).then(() => message.textContent='Paused').catch(showError);
document.querySelector('#resume').onclick = () => Civ2RuntimeReady.then(runtime => runtime.resume()).then(() => message.textContent='Running').catch(showError);
Civ2RuntimeReady.catch(showError);
if (new URLSearchParams(location.search).get('autoboot') === '1') document.querySelector('#start').click();
</script>
</html>
